<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F1B2D"><script>try{var t=localStorage.getItem("guvel-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script><title>GUVEL Operational — Smarter Industrial Systems</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:wght@400;700&family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet"><link rel="icon" type="image/png" href="assets/favicon.png"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="stylesheet" href="css/style.css?v=3.0.D"></head><body>
<section id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="brand auth-brand"><img class="brand-logo" src="assets/guvel-mark-dark.png" alt="GUVEL"><div><strong>GUVEL</strong><small>Smarter Industrial Systems</small></div></div>
    <div class="eyebrow">SECURE COMPANY ACCESS</div><h1 id="authMode">Sign In</h1><p>Operational intelligence for industrial teams.</p>
    <div id="authMessage" class="auth-message"></div>
    <form id="loginForm" class="auth-form"><label>Email<input id="loginEmail" type="email" required autocomplete="email"></label><label>Password<input id="loginPassword" type="password" required autocomplete="current-password"></label><button class="primary" type="submit">Sign In</button><button id="showSignup" class="link-btn" type="button">Create account</button></form>
    <form id="signupForm" class="auth-form hidden"><label>Full Name<input id="signupName" required></label><label>Email<input id="signupEmail" type="email" required autocomplete="email"></label><label>Password<input id="signupPassword" type="password" minlength="6" required autocomplete="new-password"></label><button class="primary" type="submit">Create Account</button><button id="showLogin" class="link-btn" type="button">I already have an account</button></form>
    <form id="companySetup" class="auth-form hidden"><label>Company Name<input id="newCompanyName" required placeholder="My Manufacturing Company"></label><label>Company Code<input id="newCompanyCode" required maxlength="50" placeholder="MY-COMPANY"></label><button class="primary" type="submit">Create Company & Continue</button></form>
    <div class="auth-foot">GUVEL Smarter Industrial Systems · Operational Intelligence</div>
  </div>
</section>
<div id="authLaserCursor" aria-hidden="true"></div>
<div id="app" class="app-shell hidden">
<header class="topbar"><div class="brand brand-lockup" role="img" aria-label="GUVEL Operational System"><img class="brand-logo" src="assets/guvel-mark-dark.png" alt=""><span class="brand-rule" aria-hidden="true"></span><div class="brand-word" aria-hidden="true"><strong><span>G</span><span>U</span><span>V</span><span>E</span><span>L</span></strong><small>Operational System</small></div></div><nav id="nav" class="top-nav" aria-label="Primary navigation"></nav><div class="top-actions"><span id="companyBadge">Loading company...</span><button id="themeBtn" class="theme-toggle" type="button" title="System theme" aria-label="System theme. Change theme">◐</button><button id="refreshBtn">Refresh</button><button id="logoutBtn" class="secondary">Logout</button></div></header>
<main class="content"><section id="view"></section></main><div id="laserCursor" aria-hidden="true"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><script src="js/config.js"></script><script src="js/app.js?v=GUVEL-UI21"></script>
</body></html>
